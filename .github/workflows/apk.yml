name: Build UpBazaar APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install EAS and deps
        run: |
          npm install
          npm install -g eas-cli

      - name: Build APK with EAS Local
        run: |
          eas build --platform android --profile preview --local --non-interactive --output ${{ github.workspace }}/UpBazaar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UpBazaar-APK
          path: UpBazaar.apk
