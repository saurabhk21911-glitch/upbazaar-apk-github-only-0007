name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - run: npm install
      - run: npx expo prebuild --clean --platform android --no-install

      - name: Fix Gradle and Toolchain clash
        run: |
          sed -i "s/gradle-8.*/gradle-7.6-all.zip/" android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s/com.android.tools.build:gradle:.*/com.android.tools.build:gradle:7.4.2'/" android/build.gradle
          # Ye 3 line hi asli dikkat hai - inko delete kar rahe hai
          sed -i "/toolchain/d" android/build.gradle
          sed -i "/languageVersion/d" android/build.gradle
          sed -i "/JavaLanguageVersion/d" android/build.gradle
          sed -i "/sourceCompatibility/d" android/build.gradle
          sed -i "/targetCompatibility/d" android/build.gradle
          sed -i "/toolchain/d" android/app/build.gradle
          sed -i "/languageVersion/d" android/app/build.gradle
          sed -i "/JavaLanguageVersion/d" android/app/build.gradle
          echo "Fixed files"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: upbazaar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
