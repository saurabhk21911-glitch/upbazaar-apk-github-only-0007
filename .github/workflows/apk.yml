name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: npx expo prebuild --clean --platform android --no-install

      - name: Fix ALL Gradle Files - Nuclear Option
        run: |
          # Gradle 8.6 use karenge Java 17 ke saath
          sed -i "s/gradle-8.*/gradle-8.6-all.zip/" android/gradle/wrapper/gradle-wrapper.properties
          
          # Saare gradle files se toolchain aur compatibility ka jhagda hatao
          echo "Cleaning app/build.gradle..."
          sed -i '/toolchain/d' android/app/build.gradle
          sed -i '/languageVersion/d' android/app/build.gradle
          sed -i '/sourceCompatibility/d' android/app/build.gradle
          sed -i '/targetCompatibility/d' android/app/build.gradle
          sed -i '/java {/d' android/app/build.gradle
          sed -i '/jvmToolchain/d' android/app/build.gradle
          
          echo "Cleaning settings.gradle..."
          sed -i '/toolchain/d' android/settings.gradle
          sed -i '/languageVersion/d' android/settings.gradle
          
          echo "Cleaning build.gradle..."
          sed -i '/toolchain/d' android/build.gradle
          sed -i '/languageVersion/d' android/build.gradle
          sed -i '/sourceCompatibility/d' android/build.gradle
          sed -i '/targetCompatibility/d' android/build.gradle
          sed -i '/java {/d' android/build.gradle

      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: upbazaar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
