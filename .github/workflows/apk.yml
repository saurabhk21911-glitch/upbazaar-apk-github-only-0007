name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install EAS
        run: npm install -g eas-cli
      - name: Install dependencies
        run: npm install
      - name: Build APK
        run: eas build --platform android --profile preview --local --non-interactive --output ./app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: upbazaar-apk
          path: ./app.apk
