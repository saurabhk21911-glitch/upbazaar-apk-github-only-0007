name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Generate Android project
        run: |
          echo "=== Starting Expo prebuild ==="
          npx expo prebuild --platform android --clean --non-interactive
          echo "=== Expo prebuild finished ==="

      - name: Check Android project
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== ANDROID DIRECTORY ==="
          if [ -d android ]; then
            echo "android folder EXISTS"
            ls -la android
          else
            echo "android folder DOES NOT EXIST"
          fi

          echo "=== GRADLE WRAPPER ==="
          if [ -f android/gradlew ]; then
            echo "android/gradlew EXISTS"
            ls -l android/gradlew
          else
            echo "android/gradlew DOES NOT EXIST"
          fi

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew
          ls -l android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
