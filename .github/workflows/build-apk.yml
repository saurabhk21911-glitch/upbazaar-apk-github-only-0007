name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. Install dependencies
      - name: Install dependencies
        run: npm install

      # 5. Check Expo configuration
      - name: Check Expo configuration
        run: |
          echo "=============================="
          echo "EXPO CONFIGURATION"
          echo "=============================="

          npx expo config --type public > expo-config.json

          echo "=== SDK VERSION ==="
          grep -n '"sdkVersion"' expo-config.json || true

          echo "=== EXPO VERSION ==="
          node -p "require('./node_modules/expo/package.json').version"

          echo "=== NODE VERSION ==="
          node --version

          echo "=== NPM VERSION ==="
          npm --version

      # 6. Generate Android project
      - name: Generate Android project
        run: |
          echo "=============================="
          echo "GENERATING ANDROID PROJECT"
          echo "=============================="

          rm -rf android

          echo "Installing npm 10.8.2..."
          npm install -g npm@10.8.2

          echo "NPM VERSION AFTER UPDATE:"
          npm --version

          echo "Running Expo prebuild..."
          CI=1 npx expo prebuild --platform android --clean

      # 7. Check Android project
      - name: Check Android project
        run: |
          echo "=============================="
          echo "ANDROID PROJECT CHECK"
          echo "=============================="

          test -d android

          echo "Android folder exists."

          ls -la android

          echo "=============================="
          echo "GRADLE FILES"
          echo "=============================="

          find android -maxdepth 2 -type f | sort | head -100

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      # 9. Build Release APK
      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
